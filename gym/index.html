<title>Bitácora de Gimnasio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one mobile column, max 560px; sticky top bar, fixed rest-timer bar at the bottom. Iron-plate red accent on cool steel greys. */
:root {
  --bg: #EDEFF2; --surface: #FFFFFF; --soft: #E2E6EB; --ink: #15181C; --muted: #5B636E;
  --line: #D3D9E0; --accent: #C22F3A; --accent-ink: #FFFFFF; --good: #1E7A4C; --warn: #A3620A;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101316; --surface: #191D22; --soft: #22282F; --ink: #ECEFF2; --muted: #9AA3AE;
  --line: #2B3139; --accent: #E5484D; --accent-ink: #FFFFFF; --good: #3DBE7E; --warn: #E3A23C; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #101316; --surface: #191D22; --soft: #22282F; --ink: #ECEFF2; --muted: #9AA3AE;
  --line: #2B3139; --accent: #E5484D; --accent-ink: #FFFFFF; --good: #3DBE7E; --warn: #E3A23C; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 140px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: .02em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 26px; height: 26px; color: var(--accent); }
h2 { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .02em; text-transform: uppercase; margin: 0; text-wrap: balance; }
h3 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }
.num { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.section { display: flex; flex-direction: column; gap: 10px; }

button { font: inherit; color: inherit; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 14px; font-weight: 600; min-height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--accent); }
.btn.big { width: 100%; font-size: 17px; min-height: 56px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, input:focus-visible, .tile:focus-visible, .seg button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions .wide { grid-column: 1 / -1; }

label { font-size: 13px; color: var(--muted); font-weight: 500; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
input[type="number"], input[type="text"] { font: inherit; font-size: 20px; font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; min-width: 0; }
input[type="text"].plain { font-family: var(--body); font-weight: 500; font-size: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stepper { display: grid; grid-template-columns: 44px 1fr 44px; gap: 6px; align-items: center; }
.stepper input { text-align: center; }
.hint { font-size: 12px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 8px 12px; font-size: 13px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.kpi .v { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 12px; color: var(--muted); }

.chart svg { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--body); font-size: 10px; fill: var(--muted); }
.chart .val { fill: var(--ink); font-weight: 600; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .b1 { fill: var(--accent); }
.chart .b2 { fill: var(--muted); opacity: .55; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

.ex-ic { width: 44px; height: 44px; flex: none; border-radius: 10px; background: var(--soft); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; }
.ex-ic svg { width: 38px; height: 38px; }
svg .pl { fill: var(--accent); stroke: none; }
svg .ph { fill: var(--surface); stroke: none; }
svg .db { fill: var(--accent); stroke: none; }
svg .bn { stroke: var(--muted); stroke-width: 3.4; }
svg .gr { stroke: var(--muted); stroke-width: 1.4; opacity: .6; }
.rec { display: flex; gap: 12px; align-items: flex-start; padding-block: 10px; border-top: 1px solid var(--line); }
.rec:first-of-type { border-top: 0; }
.rec .body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.rec .name { font-weight: 600; }
.pill { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); }
.pill.pr { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.pill.live { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }

.sets { display: flex; flex-direction: column; }
.set { display: grid; grid-template-columns: 28px 1fr auto 36px; gap: 8px; align-items: center; padding-block: 8px; border-top: 1px solid var(--line); }
.set:first-child { border-top: 0; }
.set .i { font-family: var(--display); font-weight: 700; color: var(--muted); font-size: 18px; }
.set .w { font-family: var(--display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.set .x { border: 0; background: transparent; color: var(--muted); font-size: 20px; width: 36px; height: 36px; border-radius: 8px; }
.exrow { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); text-align: left; width: 100%; }
.exrow .t { min-width: 0; flex: 1; }
.exrow .t div:first-child { font-weight: 600; }

.hist { display: flex; flex-direction: column; }
.hitem { border-top: 1px solid var(--line); }
.hitem:first-child { border-top: 0; }
.hhead { width: 100%; border: 0; background: transparent; text-align: left; padding-block: 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.hhead .d { font-weight: 600; }
.hdetail { padding-block: 0 14px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }

.sheet-bg { position: fixed; inset: 0; background: rgb(0 0 0 / .45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 12.5px; font-weight: 600; line-height: 1.2; min-width: 0; }
.tile svg { width: 52px; height: 52px; }
.tile .eq { font-size: 10.5px; font-weight: 500; color: var(--muted); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.timer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--ink); color: var(--bg); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
.timer .in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.timer .clock { font-family: var(--display); font-weight: 700; font-size: 40px; font-variant-numeric: tabular-nums; line-height: 1; min-width: 92px; }
.timer .lbl { flex: 1; font-size: 13px; opacity: .8; min-width: 0; }
.timer button { border: 1px solid color-mix(in srgb, var(--bg) 35%, transparent); background: transparent; color: var(--bg); border-radius: 10px; padding: 8px 10px; font-weight: 600; min-height: 42px; }
.timer.done { background: var(--accent); color: var(--accent-ink); animation: flash 1s steps(2) 6; }
.timer.done button { color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent-ink) 50%, transparent); }
.timer .prog { height: 3px; background: color-mix(in srgb, var(--bg) 25%, transparent); border-radius: 2px; margin: 0 auto 8px; max-width: 560px; overflow: hidden; }
.timer .prog span { display: block; height: 100%; background: var(--accent); }
@keyframes flash { 50% { filter: brightness(1.35); } }
@media (prefers-reduced-motion: reduce) { .timer.done { animation: none; } }
.banner { border: 1px solid var(--warn); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.empty { text-align: center; padding: 18px 8px; color: var(--muted); font-size: 14px; }
.confirm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 14px; }
@media (max-width: 380px) { .kpi .v { font-size: 24px; } .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 12h20M5 7v10M8 5v14M16 5v14M19 7v10"/></svg>Bitácora</div>
    <button class="iconbtn" id="btnSettings" aria-label="Ajustes">⚙</button>

  <main id="view" class="stack"><div class="empty">Cargando tus sesiones…</div></main>
</div>
<div id="sheetRoot"></div>
<div id="timer" class="timer" hidden></div>

const OTHER_ICON = `<line x1="24" y1="14" x2="24" y2="34"/><line x1="14" y1="24" x2="34" y2="24"/>`;

/* ---------- maths ---------- */
const MET_WEIGHTS = 4;  // entrenamiento de fuerza moderado (Compendium of Physical Activities: 3.5 general, 6 vigoroso)
function setKg(s) {

}
function e1rm(kg, reps) { if (!kg || !reps || reps > 20) return 0; return reps === 1 ? kg : kg * (1 + reps / 30); }

function weightsMinutes(sess) {

  const start = sess.weightsStart || ts[0];

  return Math.max(1, Math.round((new Date(end) - new Date(start)) / 60000));
}

}

  del(k) { try { localStorage.removeItem("gym:" + k); } catch {} },

/* serialised writes, one at a time per document */
const queues = {};
function writeDoc(path, data) {
  if (storeMode === "local") { const k = path.replace(/\//g, ":"); data == null ? LS.del(k) : LS.set(k, data); return Promise.resolve(); }
  const q = queues[path] || Promise.resolve();
  const p = q.then(() => data == null ? db.doc(path).delete() : db.doc(path).set(data)).catch(err => { showError(err); });
  queues[path] = p;

}
let activeTimer = null;

}

/* ---------- history lookups ---------- */
function sortedSessions() { return [...sessions].sort((a, b) => (a.startedAt || "").localeCompare(b.startedAt || "")); }
function exHistory(exId) {
  const out = [];
  for (const s of sortedSessions()) for (const ex of s.exercises || []) if (ex.exId === exId && ex.sets.length) out.push({ date: s.startedAt, ex });
  return out;
}
function exStats(exId) {
  const hist = exHistory(exId);
  if (!hist.length) return null;
  let maxKg = 0, max1 = 0, maxReps = 0, maxVol = 0;
  for (const { ex } of hist) {
    for (const s of ex.sets) { const k = setKg(s); maxKg = Math.max(maxKg, k); max1 = Math.max(max1, e1rm(k, s.reps)); maxReps = Math.max(maxReps, s.reps || 0); }
    maxVol = Math.max(maxVol, exVolume(ex));
  }
  return { last: hist[hist.length - 1], count: hist.length, maxKg, max1, maxReps, maxVol };
}

function barChart(items, classes, fmt) {
  const W = 340, H = 170, top = 18, bottom = items.some(i => i.sub) ? 36 : 22, left = 4, right = 4;
  const ch = H - top - bottom;
  const max = Math.max(1, ...items.map(i => i.parts.reduce((a, b) => a + b, 0)));
  const n = items.length, slot = (W - left - right) / Math.max(n, 1), bw = Math.min(34, slot * 0.62);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  s += `<line class="grid" x1="${left}" x2="${W - right}" y1="${top + ch}" y2="${top + ch}"/>`;
  s += `<line class="grid" x1="${left}" x2="${W - right}" y1="${top + ch / 2}" y2="${top + ch / 2}" stroke-dasharray="2 3"/>`;
  items.forEach((it, i) => {
    const cx = left + slot * i + slot / 2;
    let y = top + ch;
    it.parts.forEach((v, j) => {
      const hgt = (v / max) * ch;
      if (hgt > 0) { y -= hgt; s += `<rect class="${classes[j]}" x="${(cx - bw / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${hgt.toFixed(1)}" rx="2"/>`; }
    });
    const total = it.parts.reduce((a, b) => a + b, 0);
    if (n <= 8 || i === n - 1) s += `<text class="val" x="${cx}" y="${(y - 4).toFixed(1)}" text-anchor="middle">${esc(fmt(total))}</text>`;
    s += `<text x="${cx}" y="${top + ch + 13}" text-anchor="middle">${esc(it.label)}</text>`;
    if (it.sub) s += `<text x="${cx}" y="${top + ch + 26}" text-anchor="middle">${esc(it.sub)}</text>`;
  });
  return s + "</svg>";
}

  const repsDefault = lastSet ? lastSet.reps : (prevSet ? prevSet.reps : 10);
  let mode = modeDefault;

  const card = h("div", { class: "card" });
  card.append(h("div", { class: "row", style: "flex-wrap:nowrap" },
    h("span", { class: "ex-ic", svg: svgIcon(def.d) }),
    h("div", { style: "min-width:0;flex:1" }, h("div", { style: "font-weight:600;font-size:17px" }, ex.name), h("div", { class: "muted small" }, EQUIP_LABEL[ex.equip])),
    ex.sets.length ? null : h("button", { class: "iconbtn", "aria-label": "Quitar ejercicio", onclick: () => { active.exercises.splice(active.current, 1); active.current = active.exercises.length - 1; saveActive(); render(); } }, "×")));

  if (st) {
    const bw = ex.equip === "corporal" && !st.maxKg;
    card.append(h("div", { class: "small" },
      h("div", null, h("span", { class: "muted" }, `La última vez (${fmtShort(st.last.date)}): `), setsLine(st.last.ex)),
      h("div", null, h("span", { class: "muted" }, "Récord: "), bw ? `${st.maxReps} reps` : `${fmtKg(st.maxKg)} kg` + (st.max1 ? ` · 1RM est. ≈ ${fmtKg(st.max1)} kg` : ""))));
  } else card.append(h("div", { class: "small muted" }, "Primera vez que registras este ejercicio."));

  if (ex.sets.length) {
    const list = h("div", { class: "sets" });
    const bestPrev1 = st ? st.max1 : 0;
    ex.sets.forEach((s, j) => {
      const isPr = st && e1rm(setKg(s), s.reps) > bestPrev1 + 0.01;
      list.append(h("div", { class: "set" },
        h("span", { class: "i" }, String(j + 1)),
        h("span", { class: "w" }, setLabel(s)),
        isPr ? h("span", { class: "pill pr" }, "Récord") : h("span"),
        h("button", { class: "x", "aria-label": `Borrar set ${j + 1}`, onclick: () => { ex.sets.splice(j, 1); saveActive(); render(); } }, "×")));
    });

  }

  // input row
  const wInput = h("input", { id: "inW", type: "number", inputmode: "decimal", step: "0.5", min: "0", value: wDefault });
  const rInput = h("input", { id: "inR", type: "number", inputmode: "numeric", step: "1", min: "1", value: repsDefault });
  const step = (inp, d, min = 0) => () => { inp.value = Math.max(min, r1((num(inp.value) || 0) + d)); updHint(); };
  const hint = h("div", { class: "hint" });
  const updHint = () => {
    const w = num(wInput.value) || 0;
    if (ex.equip === "barra") hint.textContent = `${fmtKg(w)} kg en discos + ${fmtKg(settings.barWeight)} kg de barra = ${fmtKg(w + settings.barWeight)} kg`;
    else if (ex.equip === "mancuerna") hint.textContent = mode === "mano" ? `${fmtKg(w)} kg por mano = ${fmtKg(w * 2)} kg en total` : `${fmtKg(w)} kg en total`;
    else hint.textContent = w ? `Con ${fmtKg(w)} kg extra` : "Solo peso corporal; puedes anotar peso extra si usas.";
  };
  wInput.addEventListener("input", updHint);
  const seg = ex.equip === "mancuerna" ? h("div", { class: "seg", role: "group", "aria-label": "Cómo se cuenta el peso" },
    ...[["total", "Total"], ["mano", "Por mano"]].map(([k, t]) => h("button", { "aria-pressed": String(mode === k), onclick: e => { mode = k; ex.mode = k; e.currentTarget.parentNode.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === e.currentTarget))); updHint(); } }, t))) : null;
  const wLabel = ex.equip === "barra" ? "Discos (kg, sin barra)" : ex.equip === "mancuerna" ? "Mancuerna (kg)" : "Peso extra (kg)";
  card.append(h("div", { class: "grid2" },
    h("label", { for: "inW" }, wLabel, h("div", { class: "stepper" }, h("button", { class: "iconbtn", "aria-label": "Menos peso", onclick: step(wInput, ex.equip === "barra" ? -2.5 : -1) }, "−"), wInput, h("button", { class: "iconbtn", "aria-label": "Más peso", onclick: step(wInput, ex.equip === "barra" ? 2.5 : 1) }, "+"))),
    h("label", { for: "inR" }, "Reps", h("div", { class: "stepper" }, h("button", { class: "iconbtn", "aria-label": "Menos reps", onclick: step(rInput, -1, 1) }, "−"), rInput, h("button", { class: "iconbtn", "aria-label": "Más reps", onclick: step(rInput, 1) }, "+")))));
  if (seg) card.append(h("div", { class: "row between" }, seg));
  card.append(hint);
  updHint();
  card.append(h("button", { class: "btn primary big", onclick: () => {
    const w = num(wInput.value) || 0, reps = Math.round(num(rInput.value) || 0);
    if (reps < 1) { hint.textContent = "Anota cuántas reps hiciste (1 o más)."; rInput.focus(); return; }
    if (!active.weightsStart) active.weightsStart = new Date().toISOString();
    ex.sets.push({ w, reps, equip: ex.equip, mode: ex.equip === "mancuerna" ? mode : undefined, bar: ex.equip === "barra" ? settings.barWeight : undefined, t: new Date().toISOString() });
    delete ex.draftW;
    saveActive(); render();
  } }, `Agregar set ${ex.sets.length + 1}`));
  return card;
}

/* exercise picker sheet */
function openPicker() {
  const root = document.getElementById("sheetRoot");
  const close = () => root.replaceChildren();
  const tiles = h("div", { class: "tiles" });

  const fill = () => {
    chips.replaceChildren(...GROUPS.map(g => h("button", { class: "chip", "aria-pressed": String(g === pickerGroup), onclick: () => { pickerGroup = g; fill(); } }, g)));
    const list = EXERCISES.filter(e => pickerGroup === "Todos" || e.group === pickerGroup);
    tiles.replaceChildren(...list.map(e => h("button", { class: "tile", onclick: () => { addExercise(e); close(); } },
      h("span", { svg: svgIcon(e.d) }), h("span", null, e.name), h("span", { class: "eq" }, EQUIP_LABEL[e.equip]))));
  };
  fill();
  const eqSeg = h("div", { class: "seg", role: "group", "aria-label": "Equipo" }, ...Object.entries(EQUIP_LABEL).map(([k, t]) => h("button", { "aria-pressed": String(k === customEquip), onclick: e => { customEquip = k; e.currentTarget.parentNode.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === e.currentTarget))); } }, t)));
  const sheet = h("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": "Elegir ejercicio" },
    h("div", { class: "row between" }, h("h2", null, "Elegir ejercicio"), h("button", { class: "iconbtn", "aria-label": "Cerrar", onclick: close }, "×")),
    chips, tiles,
    h("div", { class: "card" }, h("h3", null, "¿No está? Agrégalo"), custom, eqSeg,
      h("button", { class: "btn", onclick: () => { const n = custom.value.trim(); if (!n) { custom.focus(); return; } addExercise({ id: "custom:" + n.toLowerCase().replace(/[^a-z0-9áéíóúñ]+/g, "-").slice(0, 60), name: n, equip: customEquip, d: OTHER_ICON }); close(); } }, "Agregar")),
    h("button", { class: "btn ghost", onclick: close }, "Cancelar"));
  root.replaceChildren(h("div", { class: "sheet-bg", onclick: e => { if (e.target === e.currentTarget) close(); } }, sheet));
}
function addExercise(e) {
  const existing = active.exercises.findIndex(x => x.exId === e.id);
  if (existing >= 0) { active.current = existing; }
  else { active.exercises.push({ exId: e.id, name: e.name, equip: e.equip, sets: [] }); active.current = active.exercises.length - 1; }
  saveActive(); render();
}

/* FINISH */
function finishView() {
  const mins = weightsMinutes(active);
  const minInput = h("input", { id: "fMin", type: "number", inputmode: "numeric", value: mins });
  const bwInput = h("input", { id: "fBw", type: "number", inputmode: "decimal", value: settings.bodyWeight });
  const out = h("div", { class: "stack" });
  const sum = h("div", { class: "card" });
  const draw = () => {
    const m = num(minInput.value) || 0, bw = num(bwInput.value) || settings.bodyWeight;
    const kw = weightsKcal(m, bw), kb = active.bike?.kcal || 0;
    sum.replaceChildren(
      h("h3", null, "Resumen"),
      h("div", { class: "kpis" },
        h("div", { class: "kpi" }, h("div", { class: "v" }, fmtInt(sessVolume(active))), h("div", { class: "l" }, "kg levantados")),
        h("div", { class: "kpi" }, h("div", { class: "v" }, fmtInt(kb + kw)), h("div", { class: "l" }, "kcal aprox.")),
        h("div", { class: "kpi" }, h("div", { class: "v" }, String(active.exercises.reduce((a, e) => a + e.sets.length, 0))), h("div", { class: "l" }, "sets"))),
      h("div", { class: "small muted" }, `Bicicleta ${fmtInt(kb)} kcal (máquina) + pesas ≈ ${fmtInt(kw)} kcal (estimado con ${MET_WEIGHTS} MET × ${fmtKg(bw)} kg × ${m} min; puede variar ±40%).`),
      ...active.exercises.filter(e => e.sets.length).map(ex => {
        const st = exStats(ex.exId);
        const best = Math.max(...ex.sets.map(s => e1rm(setKg(s), s.reps)));
        const pr = st && best > st.max1 + 0.01;
        return h("div", { class: "rec" }, h("span", { class: "ex-ic", svg: svgIcon(exDef(ex).d) }),
          h("div", { class: "body" }, h("div", { class: "name" }, ex.name, " ", pr ? h("span", { class: "pill pr" }, "Récord") : null),
            h("div", { class: "small" }, setsLine(ex)), h("div", { class: "small muted" }, `${fmtInt(exVolume(ex))} kg de volumen`)));
      }));
  };
  minInput.addEventListener("input", draw); bwInput.addEventListener("input", draw);
  draw();
  out.append(h("h2", null, "Terminar workout"),
    h("div", { class: "card" }, h("div", { class: "grid2" },
      h("label", { for: "fMin" }, "Minutos de pesas", minInput),
      h("label", { for: "fBw" }, "Tu peso hoy (kg)", bwInput)),
      h("div", { class: "hint" }, "Los minutos se calcularon desde que terminaste la bici. Corrígelos si no calzan.")),
    sum,
    h("div", { class: "actions" },
      h("button", { class: "btn primary wide big", onclick: async () => {

        sess.endedAt = sess.endedAt || new Date().toISOString();
        sess.weightsMin = m; sess.bodyWeight = bw;
        sess.volume = Math.round(sessVolume(sess));
        sess.kcalBike = sess.bike?.kcal || 0; sess.kcalWeights = Math.round(weightsKcal(m, bw));
        delete sess.current; delete sess.bikeSkipped;
        sessions = sessions.filter(s => s.id !== sess.id).concat(sess);
        active = null; stopTimer();
        go("home");
        await writeDoc("sessions/" + sess.id, sess);
        await saveActive(true);
      } }, "Guardar sesión"),
      h("button", { class: "btn ghost wide", onclick: () => { delete active.endedAt; go("workout"); } }, "Volver a la sesión")));
  return [out];
}

/* SETTINGS */
document.getElementById("btnSettings").addEventListener("click", () => {
  const root = document.getElementById("sheetRoot");
  const close = () => root.replaceChildren();
  const f = (id, label, val, hint) => h("label", { for: id }, label, h("input", { id, type: "number", inputmode: "decimal", step: "any", value: val }), hint ? h("span", { class: "hint" }, hint) : null);
  root.replaceChildren(h("div", { class: "sheet-bg", onclick: e => { if (e.target === e.currentTarget) close(); } },
    h("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": "Ajustes" },
      h("div", { class: "row between" }, h("h2", null, "Ajustes"), h("button", { class: "iconbtn", "aria-label": "Cerrar", onclick: close }, "×")),
      f("sBar", "Peso de la barra (kg)", settings.barWeight, "Se suma a los discos en ejercicios con barra. Las sesiones ya guardadas mantienen el peso que tenían."),
      f("sBw", "Tu peso corporal (kg)", settings.bodyWeight, "Se usa para estimar calorías de pesas."),
      f("sRest", "Descanso entre sets (segundos)", settings.restSec),
      f("sLvl", "Nivel predeterminado de la bici", settings.bikeLevel),
      h("button", { class: "btn primary big", onclick: () => {

        settings = { barWeight: g("sBar") ?? settings.barWeight, bodyWeight: g("sBw") || settings.bodyWeight, restSec: Math.max(10, g("sRest") || settings.restSec), bikeLevel: g("sLvl") || settings.bikeLevel };
        saveSettings(); close(); render();
      } }, "Guardar ajustes"))));
});

/* ---------- rest timer ---------- */
let timerEnd = 0, timerTotal = 0, tick = null, audio = null, beepNodes = [], wake = null;
function startTimer(sec) {
  sec = sec || settings.restSec;
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch { audio = null; }
  timerTotal = sec; timerEnd = Date.now() + sec * 1000;
  scheduleBeeps();
  try { navigator.wakeLock?.request("screen").then(w => { wake = w; }).catch(() => {}); } catch {}
  clearInterval(tick); tick = setInterval(drawTimer, 250); drawTimer();
}
function scheduleBeeps() {
  cancelBeeps();
  if (!audio) return;
  const at = audio.currentTime + Math.max(0, (timerEnd - Date.now()) / 1000);
  [0, 0.35, 0.7, 1.3, 1.65, 2.0].forEach((o, i) => {
    const osc = audio.createOscillator(), g = audio.createGain();
    osc.type = "square"; osc.frequency.value = i < 3 ? 880 : 1175;
    g.gain.setValueAtTime(0.0001, at + o); g.gain.exponentialRampToValueAtTime(0.25, at + o + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, at + o + 0.25);
    osc.connect(g).connect(audio.destination); osc.start(at + o); osc.stop(at + o + 0.3);
    beepNodes.push(osc);
  });
}
function cancelBeeps() { beepNodes.forEach(o => { try { o.stop(); o.disconnect(); } catch {} }); beepNodes = []; }
function addTime(s) { timerEnd = Math.max(Date.now(), timerEnd) + s * 1000; timerTotal += s; document.getElementById("timer").classList.remove("done"); scheduleBeeps(); clearInterval(tick); tick = setInterval(drawTimer, 250); drawTimer(); }
function stopTimer() { clearInterval(tick); tick = null; cancelBeeps(); timerEnd = 0; const t = document.getElementById("timer"); t.hidden = true; t.classList.remove("done"); try { wake?.release(); } catch {} wake = null; }
function drawTimer() {
  const t = document.getElementById("timer");
  const left = (timerEnd - Date.now()) / 1000;
  t.hidden = false;
  if (left <= 0) {
    clearInterval(tick); tick = null;
    if (!t.classList.contains("done")) { t.classList.add("done"); try { navigator.vibrate?.([400, 150, 400, 150, 700]); } catch {} }
    t.replaceChildren(h("div", { class: "in" }, h("div", { class: "clock" }, "0:00"), h("div", { class: "lbl" }, h("b", null, "¡Siguiente set!")),
      h("button", { onclick: () => addTime(30) }, "+30 s"), h("button", { onclick: stopTimer }, "Listo")));
    return;
  }
  const pct = Math.max(0, Math.min(100, 100 - (left / timerTotal) * 100));
  t.replaceChildren(h("div", { class: "prog" }, h("span", { style: `width:${pct.toFixed(1)}%` })),
    h("div", { class: "in" }, h("div", { class: "clock" }, mmss(Math.ceil(left))), h("div", { class: "lbl" }, "Descanso"),
      h("button", { onclick: () => addTime(30) }, "+30 s"), h("button", { onclick: stopTimer }, "Saltar")));
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && timerEnd) { audio?.resume?.(); drawTimer(); if (!tick && timerEnd > Date.now()) tick = setInterval(drawTimer, 250); } });

/* ---------- boot ---------- */
function maybeRender() { if (loaded.sessions && loaded.active && loaded.settings) render(); }
function bootLocal() {
  storeMode = "local";
  settings = { ...DEFAULT_SETTINGS, ...(LS.get("config:settings") || {}) };
  active = LS.get("config:active");
  const ids = LS.get("sessionIds") || [];
  sessions = ids.map(id => LS.get("sessions:" + id)).filter(Boolean);
  const orig = writeDoc;
  loaded = { sessions: true, active: true, settings: true };
  render();
}
// keep a local index of sessions in local mode
const _writeDoc = writeDoc;
writeDoc = function (path, data) {
  if (storeMode === "local" && path.startsWith("sessions/")) {
    const id = path.split("/")[1]; let ids = LS.get("sessionIds") || [];
    ids = data == null ? ids.filter(x => x !== id) : [...new Set([...ids, id])];
    LS.set("sessionIds", ids);
  }
  return _writeDoc(path, data);
};

(async function boot() {
  const c = window.claude;
  if (!c || !c.use) { bootLocal(); return; }
  c.use("sample").then(s => { sample = s; if (view === "bike") render(); }).catch(() => {});
  try { db = await c.use("db"); } catch { db = null; }
  if (!db) { bootLocal(); return; }
  storeMode = "db";
  const slow = setTimeout(() => { if (!loaded.sessions) { $view().replaceChildren(h("div", { class: "banner" }, "Tus datos aún no cargan. Revisa la conexión; la página seguirá intentando.")); } }, 10000);
  db.collection("sessions").onSnapshot(snap => {
    sessions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!snap.metadata.fromCache) clearTimeout(slow);
    loaded.sessions = true; if (view === "home") maybeRender();
  }, err => { clearTimeout(slow); loaded.sessions = true; maybeRender(); showError(err); });
  db.doc("config/active").onSnapshot(snap => {
    if (dirty || snap.metadata.hasPendingWrites) return;
    const first = !loaded.active;
    active = snap.exists ? clone(snap.data()) : null;
    loaded.active = true;
    if (first) maybeRender(); else if (view === "home") render();
  }, err => { loaded.active = true; maybeRender(); });
  db.doc("config/settings").onSnapshot(snap => {
    if (snap.exists) settings = { ...DEFAULT_SETTINGS, ...snap.data() };
    const first = !loaded.settings; loaded.settings = true;
    if (first) maybeRender();
  }, err => { loaded.settings = true; maybeRender(); });
})();
